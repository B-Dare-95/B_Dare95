title: Renumber Rooms
author: Ahmed Mohsen - DLC
tooltip: >
  Renumber rooms clockwise from a number you type.

  Scope: Whole Model (one level at a time), Selected Rooms, or Active View.

  Order: pick a starting room to sweep clockwise around it, or pick a detail
  line to number along a path (better for corridors).

  The format follows whatever you type - 101, G-001, L1-05. Unplaced rooms
  are skipped and reported. Preview before anything is written.
highlight: new
